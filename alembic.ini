# Alembic Configuration

[alembic]
# path to the migration scripts directory
script_location = alembic

# template to use to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path
prepend_sys_path = .

# timezone to use when rendering the date
# within the migration file or POST_WRITE_EPOCH timestamp, assume the timestamp is in UTC and use
# utcnow() when rendering the timestamp for the file.
# The utcnow_object() function is available for use as the utc_object value in the file template.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
