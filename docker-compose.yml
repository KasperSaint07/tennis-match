version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tennis_match_db
    environment:
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis
      POSTGRES_DB: tennis_match
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: tennis_match_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://tennis:tennis@db:5432/tennis_match
      TELEGRAM_BOT_TOKEN: test_token_for_dev
      SECRET_KEY: dev-secret-key-not-for-production
      DEBUG: "true"
      APP_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
